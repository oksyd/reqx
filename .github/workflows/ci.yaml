name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: quality / ubuntu-26.04 / stable
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Install cargo-nextest
        shell: bash
        run: |
          set -euo pipefail
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$cargo_bin"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://get.nexte.st/latest/linux \
            | tar --no-same-owner -xzf - -C "$cargo_bin"
          "$cargo_bin/cargo-nextest" --version

      - name: Rust cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-ubuntu-26.04-${{ runner.arch }}-cargo-quality-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-26.04-${{ runner.arch }}-cargo-quality-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}-

      - name: Install nightly toolchain for docsrs-check
        run: rustup toolchain install nightly --profile minimal

      - name: Run CI checks
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files | grep -E '^(\\.docs|\\.cargo)/' >/dev/null; then
            echo "error: tracked private paths detected (.docs or .cargo)"
            exit 1
          fi

          cargo fmt --all --check
          cargo check --all-targets
          cargo clippy --all-targets --all-features -- -D warnings
          cargo +nightly rustdoc --lib --all-features -- --cfg docsrs
          cargo test --doc
          cargo test --doc --all-features
          cargo nextest run
          cargo nextest run --all-features

  msrv:
    name: msrv / ubuntu-26.04 / 1.98.1
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.98.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Rust cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-ubuntu-26.04-${{ runner.arch }}-cargo-msrv-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-26.04-${{ runner.arch }}-cargo-msrv-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}-

      - name: Check default and complete feature sets
        run: |
          cargo check --all-targets
          cargo check --lib --tests --all-features

  feature-matrix:
    name: feature-matrix / ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: async-rustls-ring
            command: cargo nextest run --tests --no-default-features --features async-tls-rustls-ring,compression,resumable-upload
          - name: async-rustls-aws-lc-rs
            command: cargo nextest run --tests --no-default-features --features async-tls-rustls-aws-lc-rs,compression,resumable-upload
          - name: async-rustls-no-provider
            command: |
              cargo clippy --all-targets --no-default-features --features async-tls-rustls-no-provider,compression,resumable-upload -- -D warnings
              cargo nextest run --no-default-features --features async-tls-rustls-no-provider,compression,resumable-upload
          - name: blocking-rustls-no-provider
            command: |
              cargo clippy --all-targets --no-default-features --features blocking-tls-rustls-no-provider,compression,resumable-upload -- -D warnings
              cargo nextest run --no-default-features --features blocking-tls-rustls-no-provider,compression,resumable-upload
          - name: hybrid-rustls-no-provider
            command: |
              cargo clippy --all-targets --no-default-features --features async-tls-rustls-no-provider,blocking-tls-rustls-no-provider,compression,resumable-upload -- -D warnings
              cargo nextest run --no-default-features --features async-tls-rustls-no-provider,blocking-tls-rustls-no-provider,compression,resumable-upload
          - name: async-graviola
            command: |
              cargo clippy --all-targets --no-default-features --features async-tls-rustls-graviola,compression,resumable-upload -- -D warnings
              cargo nextest run --no-default-features --features async-tls-rustls-graviola,compression,resumable-upload
          - name: blocking-graviola
            command: |
              cargo clippy --all-targets --no-default-features --features blocking-tls-rustls-graviola,compression,resumable-upload -- -D warnings
              cargo nextest run --no-default-features --features blocking-tls-rustls-graviola,compression,resumable-upload
          - name: hybrid-graviola
            command: |
              cargo clippy --all-targets --no-default-features --features async-tls-rustls-graviola,blocking-tls-rustls-graviola,compression,resumable-upload -- -D warnings
              cargo nextest run --no-default-features --features async-tls-rustls-graviola,blocking-tls-rustls-graviola,compression,resumable-upload
          - name: hybrid-graviola-no-provider
            command: cargo nextest run --no-default-features --features async-tls-rustls-graviola,blocking-tls-rustls-graviola,async-tls-rustls-no-provider,blocking-tls-rustls-no-provider,compression,resumable-upload
          - name: graviola-dependencies
            command: |
              graph=$(mktemp)
              for features in async-tls-rustls-graviola blocking-tls-rustls-graviola async-tls-rustls-graviola,blocking-tls-rustls-graviola; do
                cargo tree --no-default-features --features "$features" -e normal,build --prefix none --format '{p}' > "$graph"
                grep -Eq '^rustls-graviola v' "$graph"
                if grep -Eq '^(ring|aws-lc-rs|aws-lc-sys) v' "$graph"; then
                  cat "$graph"
                  exit 1
                fi
              done
              cargo tree -e normal,build --prefix none --format '{p}' > "$graph"
              if grep -Eq '^(graviola|rustls-graviola) v' "$graph"; then
                cat "$graph"
                exit 1
              fi
              rm "$graph"
          - name: no-provider-dependencies
            command: |
              graph=$(mktemp)
              for features in async-tls-rustls-no-provider blocking-tls-rustls-no-provider async-tls-rustls-no-provider,blocking-tls-rustls-no-provider; do
                cargo tree --no-default-features --features "$features" -e normal,build --prefix none --format '{p}' > "$graph"
                if grep -Eq '^(ring|aws-lc-rs|aws-lc-sys) v' "$graph"; then
                  cat "$graph"
                  exit 1
                fi
              done
              cargo tree --no-default-features --features async-tls-rustls-ring -e normal,build --prefix none --format '{p}' > "$graph"
              grep -Eq '^ring v' "$graph"
              rm "$graph"
          - name: async-native
            command: cargo nextest run --tests --no-default-features --features async-tls-native,compression,resumable-upload
          - name: blocking-rustls-ring
            command: cargo nextest run --tests --no-default-features --features blocking-tls-rustls-ring,compression,resumable-upload
          - name: blocking-rustls-aws-lc-rs
            command: cargo nextest run --tests --no-default-features --features blocking-tls-rustls-aws-lc-rs,compression,resumable-upload
          - name: blocking-native
            command: cargo nextest run --tests --no-default-features --features blocking-tls-native,compression,resumable-upload
          - name: hybrid-rustls-ring
            command: cargo check --lib --tests --no-default-features --features async-tls-rustls-ring,blocking-tls-rustls-ring
          - name: hybrid-rustls-aws-lc-rs
            command: cargo check --lib --tests --no-default-features --features async-tls-rustls-aws-lc-rs,blocking-tls-rustls-aws-lc-rs
          - name: hybrid-async-ring-blocking-aws-lc-rs
            command: cargo check --lib --tests --no-default-features --features async-tls-rustls-ring,blocking-tls-rustls-aws-lc-rs
          - name: hybrid-async-aws-lc-rs-blocking-ring
            command: cargo check --lib --tests --no-default-features --features async-tls-rustls-aws-lc-rs,blocking-tls-rustls-ring
          - name: async-all-tls-backends
            command: cargo check --lib --tests --no-default-features --features async-tls-rustls-ring,async-tls-rustls-aws-lc-rs,async-tls-rustls-graviola,async-tls-rustls-no-provider,async-tls-native
          - name: blocking-all-tls-backends
            command: cargo check --lib --tests --no-default-features --features blocking-tls-rustls-ring,blocking-tls-rustls-aws-lc-rs,blocking-tls-rustls-graviola,blocking-tls-rustls-no-provider,blocking-tls-native
          - name: all-tls-backends
            command: cargo check --lib --tests --no-default-features --features async-tls-rustls-ring,async-tls-rustls-aws-lc-rs,async-tls-rustls-graviola,async-tls-rustls-no-provider,async-tls-native,blocking-tls-rustls-ring,blocking-tls-rustls-aws-lc-rs,blocking-tls-rustls-graviola,blocking-tls-rustls-no-provider,blocking-tls-native
          - name: no-transport
            command: cargo test --lib --no-default-features
          - name: internal-feature-guards
            command: |
              async_guard_log="$(mktemp)"
              blocking_guard_log="$(mktemp)"
              ! cargo check --lib --no-default-features --features _async >"$async_guard_log" 2>&1
              ! cargo check --lib --no-default-features --features _blocking >"$blocking_guard_log" 2>&1
              grep -Fq '`_async` is internal; enable an `async-tls-*` feature instead' "$async_guard_log"
              grep -Fq '`_blocking` is internal; enable a `blocking-tls-*` feature instead' "$blocking_guard_log"
          - name: compression-gzip-only
            command: cargo test --lib --no-default-features --features compression-gzip
          - name: compression-brotli-only
            command: cargo test --lib --no-default-features --features compression-brotli
          - name: compression-zstd-only
            command: cargo test --lib --no-default-features --features compression-zstd
          - name: resumable-upload-only
            command: cargo test --lib --no-default-features --features resumable-upload
          - name: otel-only
            command: cargo check --lib --no-default-features --features otel

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy

      - name: Rust cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-ubuntu-26.04-${{ runner.arch }}-cargo-feature-matrix-${{ matrix.name }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-26.04-${{ runner.arch }}-cargo-feature-matrix-${{ matrix.name }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}-

      - name: Install cargo-nextest
        shell: bash
        run: |
          set -euo pipefail
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$cargo_bin"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://get.nexte.st/latest/linux \
            | tar --no-same-owner -xzf - -C "$cargo_bin"
          "$cargo_bin/cargo-nextest" --version

      - name: Run feature profile
        run: ${{ matrix.command }}
